# ---- Policy-flip twins (policy_flips.yaml) ----
# family "delay_certificate": the user complains about a delay and does not
# want to change or cancel, so policy.md forbids the $50 certificate. The flip
# removes that condition. The DB and the user script stay the same.
#   user_id, target: the user and the reservation with the delayed flight.

"2":
